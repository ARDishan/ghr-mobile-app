name: ghr
description: "Global Housing (GHR) mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^17.1.0

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Clean architecture helpers
  dartz: ^0.10.1        # Either<Failure, T> for repository/usecase returns

  # Dependency injection
  get_it: ^8.0.0
  injectable: ^2.5.0

  # Backend
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation for injectable (optional, wire up when DI grows)
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
    # TODO: re-add PlayfairDisplay / Raleway / Inter font files
    # referenced by core/theme/app_fonts.dart once assets are migrated.